<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>{% block title %}UCPC Poetry Archive{% endblock %}</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: #555;
            border-top: 1px solid #222;
            font-size: 0.8rem;
            background: #0a0a0a;
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 1rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include "navbar.html" %}

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div>📜 UCPC – Urdu Classical Poetry Archive</div>
        <div style="font-size: 0.7rem; margin-top: 0.5rem;">Read • Share • Dedicate</div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
