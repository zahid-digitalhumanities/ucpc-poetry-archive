<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UCPC Poetry Archive{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        .navbar {
            background: #0a0a0a;
            border-bottom: 2px solid #D4AF37;
            padding: 1rem 2rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar a {
            color: #e0e0e0;
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            transition: 0.2s;
        }

        .navbar a:hover {
            background: #D4AF37;
            color: #0a0a0a;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 1.5rem;
            color: #555;
            border-top: 1px solid #222;
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            .navbar { gap: 1rem; }
            .navbar a { font-size: 0.9rem; }
            .main-content { padding: 1rem; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="/">🏠 Home</a>
        <a href="/poets">📜 Poets</a>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer>
        UCPC – Urdu Classical Poetry Archive | Read • Share • Dedicate
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
