<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>{% block title %}UCPC Poetry Archive{% endblock %}</title>

    <!-- Open Graph -->
    <meta property="og:title" content="{% block og_title %}UCPC Poetry Archive{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Classical Urdu Ghazals • Read • Share • Dedicate{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.url }}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        .navbar {
            background: #0a0a0a;
            border-bottom: 2px solid #D4AF37;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: #D4AF37;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #e0e0e0;
            text-decoration: none;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: #D4AF37;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 1.5rem;
            color: #555;
            border-top: 1px solid #222;
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                text-align: center;
            }
            .main-content {
                padding: 1rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="logo">📜 UCPC Poetry Archive</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/poets">Poets</a>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer>
        UCPC – Urdu Classical Poetry Archive | Read • Share • Dedicate
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
