{% extends "base.html" %}

{% block title %}Poets - UCPC{% endblock %}

{% block extra_css %}
<style>
    .poets-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
    }
    .poet-card {
        background: #1a1a1a;
        border-radius: 16px;
        padding: 1.5rem;
        text-align: center;
        transition: 0.2s;
        border: 1px solid #2a2a2a;
    }
    .poet-card:hover {
        border-color: #D4AF37;
        transform: translateY(-3px);
    }
    .poet-card a {
        text-decoration: none;
    }
    .poet-name-en {
        color: #D4AF37;
        font-size: 1.3rem;
        font-weight: bold;
    }
    .poet-name-urdu {
        font-family: 'Noto Nastaliq Urdu', serif;
        font-size: 1.2rem;
        color: #ccc;
        margin-top: 0.5rem;
    }
</style>
{% endblock %}

{% block content %}
<h1 style="text-align: center; color: #D4AF37; margin-bottom: 2rem;">🖋️ Classical Poets</h1>

<div class="poets-grid">
    {% for poet in poets %}
    <div class="poet-card">
        <a href="/poets/{{ poet.id }}">
            <div class="poet-name-en">{{ poet.name }}</div>
            <div class="poet-name-urdu">{{ poet.name_urdu }}</div>
        </a>
    </div>
    {% endfor %}
</div>
{% endblock %}
