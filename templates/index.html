<!DOCTYPE html>
<html>
<head>
    <title>UCPC Poetry Archive</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: #D4AF37;
            font-size: 48px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 50px;
            direction: rtl;
            font-family: 'Noto Nastaliq Urdu', 'Times New Roman', serif;
            font-size: 22px;
        }

        .btn-explore {
            display: inline-block;
            background: #D4AF37;
            color: #0a0a0a;
            padding: 14px 40px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            transition: 0.3s;
            margin-bottom: 60px;
        }

        .btn-explore:hover {
            background: #ffd966;
            transform: scale(1.05);
        }

        .featured-section {
            margin-top: 40px;
            border-top: 1px solid #222;
            padding-top: 40px;
        }

        .featured-title {
            color: #D4AF37;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .featured-links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .featured-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }

        .featured-links a:hover {
            color: #D4AF37;
        }

        .footer {
            margin-top: 60px;
            font-size: 12px;
            color: #555;
        }

        @media (max-width: 600px) {
            h1 { font-size: 32px; }
            .subtitle { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📜 UCPC Poetry Archive</h1>
        <div class="subtitle">
            کلاسیکی اردو شاعری کا خزانہ
        </div>

        <a href="/poets" class="btn-explore">
            Explore Poets →
        </a>

        <div class="featured-section">
            <div class="featured-title">✨ Featured Poets</div>
            <div class="featured-links">
                <a href="/poets/1">Mirza Ghalib</a>
                <a href="/poets/2">Mir Taqi Mir</a>
                <a href="/poets/3">Allama Iqbal</a>
                <a href="/poets/4">Faiz Ahmed Faiz</a>
                <a href="/poets/5">Jaun Elia</a>
            </div>
        </div>

        <div class="footer">
            Read • Share • Dedicate — Classical Urdu Poetry
        </div>
    </div>
</body>
</html>
