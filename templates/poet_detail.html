{% extends "base.html" %}

{% block title %}{{ poet.name }} - UCPC{% endblock %}

{% block extra_css %}
<style>
    .poet-header {
        text-align: center;
        border-bottom: 2px solid #D4AF37;
        padding-bottom: 1.5rem;
        margin-bottom: 2rem;
    }
    .poet-name-en {
        color: #D4AF37;
        font-size: 2.5rem;
        font-weight: bold;
    }
    .poet-name-urdu {
        font-family: 'Noto Nastaliq Urdu', serif;
        font-size: 1.5rem;
        color: #ccc;
        margin-top: 0.5rem;
    }
    .ghazal-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }
    .ghazal-card {
        background: #1a1a1a;
        border-radius: 16px;
        padding: 1.5rem;
        border: 1px solid #2a2a2a;
    }
    .ghazal-card:hover {
        border-color: #D4AF37;
    }
    .first-couplet {
        font-family: 'Noto Nastaliq Urdu', serif;
        font-size: 1.3rem;
        text-align: center;
        direction: rtl;
        line-height: 2;
        color: #f0e6d0;
    }
    .read-link {
        display: inline-block;
        margin-top: 1rem;
        background: #D4AF37;
        color: #0a0a0a;
        padding: 0.5rem 1.5rem;
        border-radius: 50px;
        text-decoration: none;
        font-weight: bold;
    }
</style>
{% endblock %}

{% block content %}
<div class="poet-header">
    <div class="poet-name-en">{{ poet.name }}</div>
    <div class="poet-name-urdu">{{ poet.name_urdu }}</div>
</div>

<div class="ghazal-list">
    {% for item in texts %}
    <div class="ghazal-card">
        <div class="first-couplet" dir="rtl">
            {{ item.first_couplet }}
        </div>
        <a href="/ghazals/view/{{ item.id }}" class="read-link">Read Full Ghazal →</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
