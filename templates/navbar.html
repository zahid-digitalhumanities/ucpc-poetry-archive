<style>
    .navbar {
        background: #0F172A;
        border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 0.8rem 2rem;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .nav-container {
        max-width: 1400px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
    }
    .nav-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: 'Cinzel', serif;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 2px;
        color: #D4AF37;
    }
    .nav-brand i {
        font-size: 1.4rem;
    }
    .nav-links {
        display: flex;
        gap: 0.8rem;
        flex-wrap: wrap;
        align-items: center;
    }
    .nav-link {
        color: #e0e0e0;
        text-decoration: none;
        padding: 0.5rem 1.2rem;
        border-radius: 40px;
        transition: 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        border: 1px solid transparent;
    }
    .nav-link i {
        font-size: 1rem;
        color: #D4AF37;
        transition: 0.2s;
    }
    .nav-link:hover, .nav-link.active {
        background: #D4AF37;
        color: #0a0a0a;
        transform: translateY(-2px);
        border-color: #D4AF37;
    }
    .nav-link:hover i, .nav-link.active i {
        color: #0a0a0a;
    }
    @media (max-width: 768px) {
        .nav-container {
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }
        .nav-links {
            justify-content: center;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const randomBtn = document.getElementById('randomGhazalBtn');
        if (randomBtn) {
            randomBtn.addEventListener('click', async function(e) {
                e.preventDefault();
                try {
                    const response = await fetch('/api/random-ghazal');
                    if (!response.ok) throw new Error('Failed');
                    const data = await response.json();
                    if (data.id) {
                        // Redirect to FULL GHAZAL PAGE (not poster)
                        window.location.href = `/ghazals/ghazal/${data.id}`;
                    } else {
                        alert('No ghazals found in the archive.');
                    }
                } catch (err) {
                    console.error('Random ghazal error:', err);
                    alert('Could not load random ghazal. Please try again.');
                }
            });
        }
    });
</script>
