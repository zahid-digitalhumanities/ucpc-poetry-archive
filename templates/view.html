{% extends "base.html" %}

{% block title %}{{ ghazal.poet_name }} - UCPC Poetry Archive{% endblock %}

{% block extra_head %}
<meta property="og:title" content="{{ ghazal.poet_name }} - Urdu Ghazal" />
<meta property="og:description" content="Beautiful Urdu poetry from UCPC Poetry Archive." />
<meta property="og:type" content="article" />
<meta property="og:url" content="{{ request.url }}" />
<meta property="og:site_name" content="UCPC Poetry Archive" />
<meta name="twitter:card" content="summary_large_image" />
{% endblock %}

{% block extra_css %}
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    font-family:'Segoe UI',sans-serif;
    color:white;
}

/* =========================
   MAIN PAGE
========================= */

.page-container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.page-title{
    text-align:center;
    color:#D4AF37;
    font-size:1.6rem;
    font-weight:700;
    margin-bottom:10px;
}

.page-subtitle{
    text-align:center;
    color:#999;
    font-size:0.85rem;
    margin-bottom:25px;
    letter-spacing:1px;
}

.dedication-input-area{
    background:#0f0f0f;
    border:1px solid rgba(212,175,55,0.25);
    border-radius:30px;
    padding:20px;
    margin-bottom:25px;
    text-align:center;
}

.dedication-input-area h3{
    color:#E0B94F;
    margin-bottom:15px;
    font-size:1rem;
}

.dedication-input-area input{
    width:220px;
    max-width:100%;
    background:#1a1a1a;
    border:1px solid rgba(212,175,55,0.4);
    color:#fff;
    padding:12px 16px;
    border-radius:50px;
    outline:none;
    margin:6px;
    font-size:0.9rem;
}

.dedication-input-area input::placeholder{
    color:#777;
}

.share-action{
    text-align:center;
    margin-top:25px;
}

.share-btn-poster{
    background:linear-gradient(135deg,#D4AF37,#F6D878);
    color:black;
    border:none;
    border-radius:50px;
    padding:14px 26px;
    font-weight:700;
    cursor:pointer;
    font-size:1rem;
    transition:0.2s;
}

.share-btn-poster:hover{
    transform:scale(1.03);
}

.reel-help{
    margin-top:30px;
    background:#0f0f0f;
    border-radius:25px;
    padding:20px;
    border:1px solid rgba(212,175,55,0.2);
    text-align:center;
}

.reel-help h4{
    color:#D4AF37;
    margin-bottom:12px;
}

.reel-help p{
    color:#aaa;
    font-size:0.82rem;
    line-height:1.8;
}

.reel-help a{
    display:inline-block;
    margin-top:14px;
    color:#E0B94F;
    text-decoration:none;
    font-weight:bold;
}

.back-link{
    text-align:center;
    margin-top:25px;
}

.back-link a{
    color:#777;
    text-decoration:none;
    font-size:0.82rem;
}

/* =========================
   SOCIAL POSTER
========================= */

#social-poster{
    width:1080px;
    background:#000;
    position:fixed;
    left:-99999px;
    top:0;
    padding:80px 85px 70px;
    overflow:hidden;
}

/* GOLD BORDER */

.poster-frame{
    border:2px solid rgba(212,175,55,0.55);
    border-radius:35px;
    padding:70px 60px;
    background:linear-gradient(180deg,#000000 0%,#070707 100%);
}

/* WATERMARK */

.poster-watermark{
    text-align:center;
    color:#D4AF37;
    font-size:34px;
    letter-spacing:5px;
    font-weight:700;
    margin-bottom:18px;
    text-shadow:0 0 8px rgba(212,175,55,0.15);
}

.poster-tagline{
    text-align:center;
    color:#888;
    font-size:22px;
    letter-spacing:3px;
    margin-bottom:55px;
}

/* POET */

.poster-poet{
    text-align:center;
    color:#E8C766;
    font-size:56px;
    margin-bottom:70px;
    font-weight:600;
    text-shadow:0 0 8px rgba(212,175,55,0.12);
}

/* SHER */

.poster-sher{
    text-align:center;
    direction:rtl;
    unicode-bidi:embed;

    font-family:
    'Noto Nastaliq Urdu',
    'Jameel Noori Nastaleeq',
    serif;

    color:#fff;

    font-size:58px;
    font-weight:500;

    line-height:1.8;

    margin-bottom:55px;

    word-spacing:3px;
}

/* DEDICATION */

.poster-dedication{
    margin-top:50px;
    text-align:ce
