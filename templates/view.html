<style>
    /* ========== HIDDEN SOCIAL POSTER ========== */
    #social-poster {
        width: 1080px;
        height: 1920px;
        background: linear-gradient(180deg, #050505 0%, #111111 100%);
        position: fixed;
        left: -99999px;
        top: 0;
        padding: 80px 60px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif;
    }

    .poster-watermark {
        text-align: center;
        color: #D4AF37;
        font-size: 36px;
        letter-spacing: 4px;
        margin-bottom: 30px;
    }

    .poster-poet {
        text-align: center;
        font-size: 46px;
        color: #E8C766;
        margin-bottom: 50px;
    }

    .poster-verses {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .poster-sher {
        text-align: center;
        font-size: 50px;
        line-height: 2.2;
        margin-bottom: 50px;
        color: #F8F1DA;
    }

    .poster-sher:last-child {
        margin-bottom: 0;
    }

    .poster-dedication {
        text-align: center;
        font-size: 42px;
        color: #E8C766;
        margin: 30px 0 20px 0;
        line-height: 1.5;
    }

    .poster-footer {
        text-align: center;
        font-size: 24px;
        color: rgba(224,185,79,0.5);
        margin-top: 20px;
    }
</style>

<div id="social-poster">
    <div>
        <div class="poster-watermark">✨ UCPC POETRY ARCHIVE ✨</div>
        <div class="poster-poet">{{ ghazal.poet_name }}</div>
    </div>
    
    <div class="poster-verses">
        {% for verse in poster_verses %}
        <div class="poster-sher" dir="rtl">
            {{ verse.misra1_urdu }}<br>
            {{ verse.misra2_urdu }}
        </div>
        {% endfor %}
    </div>
    
    <div>
        <div class="poster-dedication" id="posterDedication">✨ Dedicated Urdu Poetry ✨</div>
        <div class="poster-footer">www.ucpcpoetry.com</div>
    </div>
</div>
