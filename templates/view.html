<!-- ========================= -->
<!-- ULTRA COMPACT UCPC POSTER -->
<!-- ========================= -->

<div id="poster-container" class="theme-black">

    <div class="poster-border"></div>

    <div class="poster-inner">

        <!-- HEADER -->
        <div class="poster-header">

            <div class="logo-row">
                ✨ UCPC POETRY ARCHIVE ✨
            </div>

            <div class="follow-line">
                FOLLOW DAILY UPDATES
            </div>

            <div class="poet-line-wrap">
                <div class="line"></div>

                <div class="poet-name">
                    {{ ghazal.poet_name }}
                </div>

                <div class="line"></div>
            </div>

        </div>

        <!-- VERSES -->
        <div class="verses-area">

            {% for verse in poster_verses[:2] %}

            <div class="misra white">
                {{ verse.misra1_urdu|safe }}
            </div>

            <div class="misra gold">
                {{ verse.misra2_urdu|safe }}
            </div>

            {% endfor %}

        </div>

        <!-- DEDICATION -->
        <div id="dedicationBox" class="dedication hidden">
            💝 From Zahid ❤️ To Ayesha
        </div>

        <!-- LINK -->
        <a href="{{ ghazal_full_url }}"
           target="_blank"
           class="ghazal-link">

            <div class="line"></div>

            <div class="link-text">
                📜 {{ ghazal_full_url }}
            </div>

            <div class="line"></div>

        </a>

        <!-- FOOTER -->
        <div class="footer-box">

            <div class="footer-line"></div>

            <div class="footer-text">
                🔔 UCPC Poetry Archive 🔔
            </div>

            <div class="footer-line"></div>

        </div>

    </div>

</div>



<style>

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Nastaliq+Urdu:wght@400;500;600&display=swap');

body{
    background:#000;
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

/* ===================== */
/* MAIN POSTER */
/* ===================== */

#poster-container{
    width:1080px;
    background:#020202;
    position:relative;
    overflow:hidden;
    border-radius:28px;

    background-image:
    radial-gradient(circle at top,
    rgba(255,215,0,0.08),
    transparent 45%);
}

/* AUTO HEIGHT */
.poster-inner{
    padding:22px 26px 20px;
}

/* OUTER BORDER */

.poster-border{
    position:absolute;
    inset:10px;
    border:2px solid rgba(212,175,55,0.65);
    border-radius:24px;
    pointer-events:none;
}

/* ===================== */
/* HEADER */
/* ===================== */

.poster-header{
    text-align:center;
}

.logo-row{
    font-family:'Cinzel', serif;
    font-size:72px;
    font-weight:800;
    color:#D4AF37;
    line-height:1;
    letter-spacing:1px;
}

.follow-line{
    margin-top:6px;
    font-size:22px;
    color:#f1d37a;
    font-weight:700;
    letter-spacing:2px;
}

/* POET */

.poet-line-wrap{
    display:flex;
    align-items:center;
    gap:24px;

    margin-top:12px;
}

.line{
    flex:1;
    height:2px;
    background:rgba(212,175,55,0.7);
}

.poet-name{
    font-family:'Cinzel', serif;
    font-size:82px;
    font-weight:700;
    color:#D4AF37;
    line-height:1;
    white-space:nowrap;
}

/* ===================== */
/* VERSES */
/* ===================== */

.verses-area{
    margin-top:26px;
    text-align:center;
}

.misra{
    direction:rtl;
    font-family:'Noto Nastaliq Urdu', serif;

    font-size:58px;
    line-height:1.9;

    white-space:nowrap;
}

.white{
    color:#ffffff;
}

.gold{
    color:#e9c76d;
}

/* ===================== */
/* DEDICATION */
/* ===================== */

.dedication{
    margin-top:18px;

    text-align:center;

    font-size:26px;
    color:#f3d27a;
    font-weight:600;
}

.hidden{
    display:none;
}

/* ===================== */
/* LINK */
/* ===================== */

.ghazal-link{
    margin-top:16px;

    display:flex;
    align-items:center;
    gap:18px;

    text-decoration:none;
}

.link-text{
    color:#f3d27a;
    font-size:24px;
    white-space:nowrap;
}

/* ===================== */
/* FOOTER */
/* ===================== */

.footer-box{
    margin-top:10px;

    display:flex;
    align-items:center;
    gap:18px;

    padding-bottom:18px;
}

.footer-line{
    flex:1;
    height:1px;
    background:rgba(212,175,55,0.55);
}

.footer-text{
    color:#D4AF37;
    font-size:24px;
    white-space:nowrap;
}

/* ===================== */
/* THEMES */
/* ===================== */

.theme-black{
    background:#020202;
}

.theme-maroon{
    background:#140507;
}

.theme-blue{
    background:#07111f;
}

.theme-green{
    background:#07140b;
}

.theme-purple{
    background:#12071a;
}

</style>
