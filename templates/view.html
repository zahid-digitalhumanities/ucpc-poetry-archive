{% extends "base.html" %}

{% block title %}{{ ghazal.poet_name }} - UCPC{% endblock %}

{% block extra_css %}
<style>
    .ghazal-container {
        background: #1a1a1a;
        border-radius: 24px;
        padding: 2rem;
        border: 2px solid #D4AF37;
    }
    .poet-name {
        text-align: center;
        color: #D4AF37;
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 2rem;
    }
    .verse {
        text-align: center;
        direction: rtl;
        font-family: 'Noto Nastaliq Urdu', 'Times New Roman', serif;
        font-size: 1.4rem;
        line-height: 2.2;
        margin-bottom: 1.8rem;
        color: #f0e6d0;
    }
    .share-section {
        text-align: center;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #333;
    }
    .share-btn {
        background: #D4AF37;
        color: #0a0a0a;
        border: none;
        padding: 0.6rem 1.2rem;
        border-radius: 50px;
        font-weight: bold;
        margin: 0.3rem;
        cursor: pointer;
        font-size: 0.9rem;
    }
    .share-btn:hover {
        background: #ffd966;
    }
    .back-link {
        text-align: center;
        margin-top: 1.5rem;
    }
    .back-link a {
        color: #888;
        text-decoration: none;
    }
    .back-link a:hover {
        color: #D4AF37;
    }
    @media (max-width: 600px) {
        .ghazal-container { padding: 1rem; }
        .verse { font-size: 1.1rem; }
        .poet-name { font-size: 1.5rem; }
    }
</style>
{% endblock %}

{% block content %}
<div class="ghazal-container">
    <div class="poet-name">{{ ghazal.poet_name }}</div>

    <!-- Verses -->
    {% for verse in verses %}
    <div class="verse" dir="rtl">
        {{ verse.misra1_urdu }}<br>
        {{ verse.misra2_urdu }}
    </div>
    {% endfor %}

    <!-- Share Section -->
    <div class="share-section">
        <button class="share-btn" onclick="shareWhatsApp()">📱 WhatsApp</button>
        <button class="share-btn" onclick="shareFacebook()">📘 Facebook</button>
        <button class="share-btn" onclick="copyLink()">🔗 Copy Link</button>
    </div>
</div>

<div class="back-link">
    <a href="/poets/{{ ghazal.poet_id }}">← Back to Poet</a>
    <span style="color: #444;"> • </span>
    <a href="/poets">All Poets</a>
</div>

<script>
    function shareWhatsApp() {
        const url = window.location.href;
        const text = encodeURIComponent(`✨ Beautiful Urdu Ghazal ✨\n\nRead here:\n${url}`);
        window.open(`https://wa.me/?text=${text}`, "_blank");
    }

    function shareFacebook() {
        const url = encodeURIComponent(window.location.href);
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, "_blank");
    }

    function copyLink() {
        navigator.clipboard.writeText(window.location.href);
        alert("✅ Link copied!");
    }
</script>
{% endblock %}
