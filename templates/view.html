{% extends "base.html" %}

{% block title %}{{ ghazal.poet_name }} - UCPC{% endblock %}

{% block extra_css %}
<style>
    .ghazal-container {
        background: #1a1a1a;
        border-radius: 24px;
        padding: 2rem;
        border: 2px solid #D4AF37;
    }
    .poet-name {
        text-align: center;
        color: #D4AF37;
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 2rem;
    }
    .verse {
        text-align: center;
        direction: rtl;
        font-family: 'Noto Nastaliq Urdu', serif;
        font-size: 1.5rem;
        line-height: 2.2;
        margin-bottom: 2rem;
        color: #f0e6d0;
    }
    .share-section {
        text-align: center;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #333;
    }
    .share-btn {
        background: #D4AF37;
        color: #0a0a0a;
        border: none;
        padding: 0.6rem 1.2rem;
        border-radius: 50px;
        font-weight: bold;
        margin: 0.3rem;
        cursor: pointer;
    }
    .dedication-input {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
    }
    .dedication-input input {
        background: #2a2a2a;
        border: 1px solid #444;
        color: #e0e0e0;
        padding: 0.6rem 1rem;
        border-radius: 50px;
    }
</style>
{% endblock %}

{% block content %}
<div class="ghazal-container">
    <div class="poet-name">{{ ghazal.poet_name }}</div>

    <!-- Dedication -->
    <div class="dedication-input">
        <input type="text" id="fromName" placeholder="From (Your Name)">
        <input type="text" id="toName" placeholder="To (Someone Special)">
    </div>

    <!-- Verses -->
    {% for verse in verses %}
    <div class="verse" dir="rtl">
        {{ verse.misra1_urdu }}<br>
        {{ verse.misra2_urdu }}
    </div>
    {% endfor %}

    <!-- Share -->
    <div class="share-section">
        <button class="share-btn" onclick="shareWhatsApp()">📱 WhatsApp</button>
        <button class="share-btn" onclick="shareFacebook()">📘 Facebook</button>
        <button class="share-btn" onclick="copyLink()">🔗 Copy Link</button>
    </div>
</div>

<script>
    function buildMessage() {
        const from = document.getElementById("fromName").value.trim();
        const to = document.getElementById("toName").value.trim();
        const url = window.location.href;
        if (from && to) return `✨ Ghazal Dedication ✨\n\nFrom: ${from}\nTo: ${to}\n\nRead here:\n${url}`;
        if (from) return `✨ Ghazal from ${from} ✨\n\nRead here:\n${url}`;
        if (to) return `✨ Ghazal dedicated to ${to} ✨\n\nRead here:\n${url}`;
        return `✨ Beautiful Urdu Ghazal ✨\n\nRead here:\n${url}`;
    }
    function shareWhatsApp() {
        window.open(`https://wa.me/?text=${encodeURIComponent(buildMessage())}`, "_blank");
    }
    function shareFacebook() {
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`, "_blank");
    }
    function copyLink() {
        navigator.clipboard.writeText(window.location.href);
        alert("✅ Link copied!");
    }
</script>
{% endblock %}
