{% extends "base.html" %}

{% block title %}{{ ghazal.poet_name }} - UCPC Poetry Archive{% endblock %}

{% block extra_head %}
<!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
<meta property="og:title" content="{{ ghazal.poet_name }} - Urdu Ghazal" />
<meta property="og:description" content="Beautiful Urdu poetry from {{ ghazal.poet_name }}. Read and share classical ghazals." />
<meta property="og:type" content="article" />
<meta property="og:url" content="{{ request.url }}" />
<meta property="og:image" content="https://ucpc-poetry-archive.onrender.com/static/og-image.png" />
<meta property="og:site_name" content="UCPC Poetry Archive" />
<meta property="og:locale" content="ur_PK" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ ghazal.poet_name }} - Urdu Ghazal" />
<meta name="twitter:description" content="Beautiful Urdu poetry" />
<meta name="twitter:image" content="https://ucpc-poetry-archive.onrender.com/static/og-image.png" />
{% endblock %}

{% block extra_css %}
<!-- your existing CSS -->
{% endblock %}

{% block content %}
<!-- your existing content -->
{% endblock %}
