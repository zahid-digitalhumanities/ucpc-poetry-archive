{% extends "base.html" %}

{% block title %}
{{ ghazal.poet_name }} - Full Ghazal
{% endblock %}

{% block extra_css %}

<style>

.full-ghazal-container{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}

.poet-title{
    text-align:center;
    color:#D4AF37;
    font-size:52px;
    margin-bottom:50px;
    font-family:serif;
}

.verse-block{
    margin-bottom:45px;
    text-align:center;
}

.misra{
    direction:rtl;
    font-size:42px;
    line-height:2.2;
    color:#ffffff;
    font-family:'Noto Nastaliq Urdu', serif;
}

.gold{
    color:#f3d27a;
}

.share-box{
    margin-top:50px;
    text-align:center;
}

.share-btn{
    display:inline-block;
    background:#D4AF37;
    color:#000;
    padding:14px 28px;
    border-radius:50px;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:768px){

    .misra{
        font-size:28px;
    }

    .poet-title{
        font-size:36px;
    }

}

</style>{% endblock %}

{% block content %}

<div class="full-ghazal-container"><h1 class="poet-title">
{{ ghazal.poet_name }}
</h1>{% for verse in all_verses %}

<div class="verse-block"><div class="misra">
{{ verse.misra1_urdu }}
</div><div class="misra gold">
{{ verse.misra2_urdu }}
</div></div>{% endfor %}

<div class="share-box"><a href="/poster/{{ ghazal.id }}" class="share-btn">
🎨 Create Poster
</a></div></div>{% endblock %}
